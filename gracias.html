<!DOCTYPE html>

<style>
  :root {
    --bg: #f7f8f6;
    --text: #1c2224;
    --text-faint: #626c6e;
    --navy: #3f6470;
    --navy-deep: #1f3a42;
    --gold: #b8964f;
    --gold-deep: #8a6c2c;
    --gold-tint: #f3e9d3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: linear-gradient(165deg, var(--bg), var(--gold-tint) 130%);
    color: var(--text); font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  h1, h2 { font-family: "Poppins", -apple-system, sans-serif; text-wrap: balance; margin: 0; font-weight: 700; }
  .card {
    background: #fff; border-radius: 24px; padding: 44px 32px; max-width: 460px; width: 100%;
    text-align: center; box-shadow: 0 24px 60px -20px rgba(31,58,66,0.25);
  }
  .check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--gold-tint);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
  }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 10px;
  }
  h1 { font-size: 24px; color: var(--navy-deep); line-height: 1.3; }
  p { font-size: 15.5px; color: var(--text-faint); line-height: 1.55; margin: 14px 0 0; }
  .wa-titulo {
    margin-top: 30px; font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--navy); }
  .wa-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 12px; background: linear-gradient(155deg, #3fb56f, #1f9a52); color: #fff;
    font-family: "Manrope", sans-serif; font-weight: 800; font-size: 16px;
    padding: 16px 20px; border-radius: 999px; text-decoration: none;
    box-shadow: 0 12px 24px -8px rgba(31,154,82,0.45);
    transition: transform 0.15s ease;
  }
  .wa-btn:hover { transform: translateY(-2px); }
  .wa-numero { margin-top: 10px; font-size: 14px; color: var(--text-faint); }
</style>
</head>

  <div class="card">
